name: Magyar Kozlony figyelo

on:
  schedule:
    # Minden 10 percben lefut (UTC ido szerint)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lehetove teszi, hogy kezzel is elindithasd

permissions:
  contents: write

jobs:
  check-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Repo letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Csomagok telepitese
        run: pip install -r requirements.txt

      - name: Szkript futtatasa
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kozlony_figyelo.py

      - name: Allapot mentese (uj guid commitolasa)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_guid.txt
          git diff --staged --quiet || git commit -m "Allapot frissitve"
          git push
