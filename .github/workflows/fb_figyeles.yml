name: Facebook oldalak figyelese

on:
  schedule:
    # Minden 15 percben lefut (UTC ido szerint)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lehetove teszi, hogy kezzel is elindithasd

permissions:
  contents: write

jobs:
  check-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Repo letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Csomagok telepitese
        run: pip install requests

      - name: Szkript futtatasa
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FB_TELEGRAM_CHAT_ID: ${{ secrets.FB_TELEGRAM_CHAT_ID }}
        run: python fb_figyelo.py

      - name: Allapot mentese (uj postok commitolasa)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add fb_last_posts.json
          git diff --staged --quiet || git commit -m "FB allapot frissitve"
          git push
